[project]
name = "localmail"
version = "0.1.0"
description = "Local QQ Mail IMAP demo with FastAPI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic[email]>=2.8.0",
  "chromadb>=0.5.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
